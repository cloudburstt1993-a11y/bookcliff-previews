# Deletes previews past their expiry date (14 days after they're built), every morning (D-035).
name: Expire old previews

on:
  schedule:
    - cron: "17 9 * * *" # 02:17 or 03:17 Mountain, well before the 6:00 quiet window
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previews
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Delete expired previews
        run: node tools/expire.js
      - name: Publish
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing expired."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expire previews past their date"
          git push
