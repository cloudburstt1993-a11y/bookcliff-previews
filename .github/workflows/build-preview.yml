# Builds one preview site and publishes it (D-035). Started by the Bookcliff Portal's "Make a preview site"
# button, or by hand from the Actions tab. Inputs reach the shell only through environment variables, never
# pasted into a command, so a business name can't run code.
name: Build a preview

on:
  workflow_dispatch:
    inputs:
      name:
        description: Business name
        required: true
        type: string
      town:
        description: Town
        required: false
        default: Grand Junction
        type: string
      trade:
        description: "Trade: cleaning, hauling, construction, salon, health, auto, landscaping, professional, food, general (blank to guess)"
        required: false
        default: ""
        type: string
      phone:
        description: The phone number the business publishes (blank for a marked sample)
        required: false
        default: ""
        type: string
      request:
        description: The portal's request ID
        required: false
        default: ""
        type: string
      site:
        description: Their website, Facebook or Instagram page (logo, photos, colors and details come from it; D-044)
        required: false
        default: ""
        type: string
      logo:
        description: A link to their logo image
        required: false
        default: ""
        type: string
      photos:
        description: Up to 6 links to their own photos, one per line
        required: false
        default: ""
        type: string
      details:
        description: "What the portal's lookup found, as JSON: social pages to link, their services, a short description (D-060)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: previews
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install the builder's packages
        run: if [ -f tools/package-lock.json ]; then npm ci --prefix tools --omit=dev --no-audit --no-fund; fi
      - name: Build the preview
        env:
          NAME: ${{ inputs.name }}
          TOWN: ${{ inputs.town }}
          TRADE: ${{ inputs.trade }}
          PHONE: ${{ inputs.phone }}
          REQUEST: ${{ inputs.request }}
          SITE: ${{ inputs.site }}
          LOGO: ${{ inputs.logo }}
          PHOTOS: ${{ inputs.photos }}
          DETAILS: ${{ inputs.details }}
          # Google Places API (New), for the business's Google listing details and photos. Optional:
          # without it the builder uses their website and the links given (D-044).
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          set -euo pipefail
          args=(--name "$NAME" --town "${TOWN:-Grand Junction}" --out .)
          if [ -n "$TRADE" ]; then args+=(--trade "$TRADE"); fi
          if [ -n "$PHONE" ]; then args+=(--phone "$PHONE"); fi
          if [ -n "$REQUEST" ]; then args+=(--request "$REQUEST"); fi
          if [ -n "$SITE" ]; then args+=(--site "$SITE"); fi
          if [ -n "$LOGO" ]; then args+=(--logo "$LOGO"); fi
          if [ -n "$PHOTOS" ]; then args+=(--photos "$PHOTOS"); fi
          if [ -n "$DETAILS" ]; then args+=(--details "$DETAILS"); fi
          node tools/build-preview.js "${args[@]}"
      - name: Publish
        env:
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preview: $NAME"
          git push
